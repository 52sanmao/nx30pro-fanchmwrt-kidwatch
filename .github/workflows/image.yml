name: build-image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "FanchmWrt 源码分支"
        required: true
        default: "fanchmwrt-25.12.4"
      extra_packages:
        description: "额外软件包（空格分隔，可留空）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf --one-file-system \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /opt/az \
            /usr/share/swift /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file wget quilt python3-setuptools \
            swig time libelf-dev cpio bc
          df -h /

      - name: 拉取 FanchmWrt 源码
        run: |
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            https://github.com/fanchmwrt/fanchmwrt.git openwrt
          cd openwrt
          git log -1 --format='commit %H%nsubject %s'
          cat feeds.conf.default

      - name: 放入自定义软件包
        run: |
          cp -r packages/kidwatch packages/luci-app-kidwatch openwrt/package/
          ls -la openwrt/package/kidwatch openwrt/package/luci-app-kidwatch

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cd openwrt
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=n"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_h3c_magic-nx30-pro=y"
            echo "CONFIG_PACKAGE_kidwatch=y"
            echo "CONFIG_PACKAGE_luci-app-kidwatch=y"
            # 还原设备当前固件的软件包集合（见 configs/nx30pro-packages.txt）
            while read -r p; do
              [ -n "$p" ] && echo "CONFIG_PACKAGE_${p}=y"
            done < "$GITHUB_WORKSPACE/configs/nx30pro-packages.txt"
            if [ -n "${{ inputs.extra_packages }}" ]; then
              for p in ${{ inputs.extra_packages }}; do
                echo "CONFIG_PACKAGE_${p}=y"
              done
            fi
          } > .config
          make defconfig
          echo "=== 设备 ==="
          grep "^CONFIG_TARGET_.*DEVICE_h3c" .config || { echo "ERROR: 设备未选中"; exit 1; }
          echo "=== 自定义包 ==="
          grep -E "CONFIG_PACKAGE_(kidwatch|luci-app-kidwatch)" .config || { echo "ERROR: 自定义包未选中"; exit 1; }
          echo "=== 包总数 ==="
          grep -c "^CONFIG_PACKAGE_.*=y" .config

      - name: 预下载源码包
        run: |
          cd openwrt
          make -j"$(nproc)" download || echo "部分包下载失败，交给编译阶段重试"

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s
          echo "=== 编译完成 ==="

      - name: 查看产物
        if: always()
        run: |
          df -h /
          ls -lh openwrt/bin/targets/mediatek/filogic/ || true
          cat openwrt/bin/targets/mediatek/filogic/sha256sums 2>/dev/null || true

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-kidwatch-${{ inputs.branch }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
          if-no-files-found: warn
          retention-days: 60

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            openwrt/.config
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 7

# 触发 Actions 重新扫描
